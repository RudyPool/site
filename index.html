<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IGN Perú - Exportador SHP ZIP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        header { background: #003366; color: white; padding: 20px; text-align: center; }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: monospace; }
        .btn { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; margin-top: 15px; transition: 0.2s; }
        .btn-primary { background: #003366; margin-right: 10px; }
        .btn-shp { background: #d32f2f; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        #map { height: 400px; border-radius: 12px; border: 1px solid #ddd; margin-top: 20px; }
        .input-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        label { font-weight: 600; display: block; margin-bottom: 5px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; font-size: 12px; }
        th { background: #003366; color: white; }
    </style>
</head>
<body>

<header>
    <h1>Generador Shapefile ZIP - IGN Perú</h1>
</header>

<div class="container">
    <div class="card">
        <div class="input-row">
            <div>
                <label for="modo">Modo de Conversión:</label>
                <select id="modo" style="padding:8px; border-radius:4px;">
                    <option value="geo2utm">Geográficas → UTM</option>
                    <option value="utm2geo">UTM → Geográficas</option>
                </select>
            </div>
            <div>
                <label for="zona">Zona UTM:</label>
                <input type="number" id="zona" value="18" style="width: 50px; padding:7px; border-radius:4px; border:1px solid #ccc;">
            </div>
            <div>
                <label for="hem">Hemisferio:</label>
                <select id="hem" style="padding:8px; border-radius:4px;">
                    <option value="S">SUR</option>
                    <option value="N">NORTE</option>
                </select>
            </div>
        </div>

        <label for="entrada">Coordenadas (Latitud Longitud):</label>
        <textarea id="entrada" placeholder="-12.0463 -77.0307&#10;-12.0892 -77.0125"></textarea>
        
        <div>
            <button class="btn btn-primary" onclick="procesar()">1. Procesar Puntos</button>
            <button class="btn btn-shp" onclick="descargarSHP()">2. Descargar SHP (.ZIP)</button>
        </div>
    </div>

    <div id="map"></div>

    <div class="card" style="overflow-x:auto;">
        <table id="tabla">
            <thead>
                <tr><th>Punto</th><th>Latitud</th><th>Longitud</th><th>Este (X)</th><th>Norte (Y)</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://rawcdn.githack.com/mapbox/shp-write/7893f486307328004f767a99f36f6f9660233633/shpwrite.js"></script>

<script>
    let puntosGlobal = [];
    const map = L.map('map').setView([-12.04, -77.03], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let capaMarcadores = L.layerGroup().addTo(map);

    function procesar() {
        puntosGlobal = [];
        capaMarcadores.clearLayers();
        const texto = document.getElementById("entrada").value.trim();
        if(!texto) return alert("Ingrese coordenadas");

        const modo = document.getElementById("modo").value;
        const zona = document.getElementById("zona").value;
        const hem = document.getElementById("hem").value;
        const utmDef = `+proj=utm +zone=${zona} ${hem === 'S' ? '+south' : ''} +datum=WGS84 +units=m +no_defs`;
        
        let html = "";
        let bounds = [];

        texto.split("\n").forEach((linea, i) => {
            const c = linea.trim().split(/\s+/);
            if(c.length < 2) return;
            let lat, lon, x, y;
            try {
                if(modo === "geo2utm") {
                    lat = parseFloat(c[0]); lon = parseFloat(c[1]);
                    const res = proj4("+proj=longlat +datum=WGS84", utmDef, [lon, lat]);
                    x = res[0]; y = res[1];
                } else {
                    x = parseFloat(c[0]); y = parseFloat(c[1]);
                    const res = proj4(utmDef, "+proj=longlat +datum=WGS84", [x, y]);
                    lon = res[0]; lat = res[1];
                }
                puntosGlobal.push({ id: i+1, lat, lon, x, y });
                html += `<tr><td>${i+1}</td><td>${lat.toFixed(6)}</td><td>${lon.toFixed(6)}</td><td>${x.toFixed(2)}</td><td>${y.toFixed(2)}</td></tr>`;
                L.marker([lat, lon]).addTo(capaMarcadores).bindPopup("Punto " + (i+1));
                bounds.push([lat, lon]);
            } catch(e) { console.error("Fila con error: " + linea); }
        });
        document.querySelector("#tabla tbody").innerHTML = html;
        if(bounds.length) map.fitBounds(bounds);
    }

    function descargarSHP() {
        if (!puntosGlobal.length) return alert("Primero presione 'Procesar Puntos'");

        const geojson = {
            type: "FeatureCollection",
            features: puntosGlobal.map(p => ({
                type: "Feature",
                geometry: { type: "Point", coordinates: [p.lon, p.lat] },
                properties: { 
                    ID: p.id, 
                    ESTE: parseFloat(p.x.toFixed(2)), 
                    NORTE: parseFloat(p.y.toFixed(2)) 
                }
            }))
        };

        try {
            // El motor shpwrite.download genera el SHP, DBF, PRJ y lo mete en un ZIP
            shpwrite.download(geojson, {
                folder: 'IGN_PUNTOS_EXPORT',
                types: { point: 'Puntos_SHP' }
            });
        } catch (err) {
            console.error(err);
            alert("Error: El motor de compresión falló. Intente en modo Incógnito.");
        }
    }
</script>
</body>
</html>
