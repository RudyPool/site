<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alekhine Masterclass - Tutorial de Ajedrez</title>
    <!-- Librerías de Ajedrez -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #b58863;
            --accent: #f0d9b5;
            --text: #ffffff;
            --highlight: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary);
            width: 100%;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .main-layout {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 40px 20px;
            max-width: 1200px;
            width: 100%;
        }

        #board-container {
            width: 500px;
            max-width: 90vw;
        }

        .controls-panel {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            background: rgba(0,0,0,0.2);
            padding: 25px;
            border-radius: 12px;
            border-left: 4px solid var(--secondary);
        }

        h2 { color: var(--secondary); margin-top: 0; }

        .lesson-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { background-color: #8e6a4d; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        .explanation {
            line-height: 1.6;
            font-size: 1.1rem;
            min-height: 150px;
        }

        .move-history {
            margin-top: 15px;
            font-family: monospace;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            color: #aaa;
        }

        .highlight-text {
            color: var(--highlight);
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #board-container { width: 350px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Aprende a Jugar como Alekhine</h1>
    <p>Tutorial de Apertura y Desarrollo Dinámico</p>
</header>

<div class="main-layout">
    <div id="board-container">
        <div id="myBoard" style="width: 100%"></div>
        <div class="move-history" id="pgn">Movimientos: -</div>
    </div>

    <div class="controls-panel">
        <h2 id="lesson-title">Cargando Lección...</h2>
        <div class="explanation" id="lesson-desc">
            Selecciona una lección para comenzar tu entrenamiento al estilo del cuarto campeón mundial.
        </div>

        <div class="lesson-nav">
            <button id="prevBtn" onclick="prevLesson()">Anterior</button>
            <button id="nextBtn" onclick="nextLesson()">Siguiente Lección</button>
        </div>

        <div style="margin-top: 20px;">
            <h3>Progreso de la Lección</h3>
            <div id="step-info" style="color: var(--accent);">Paso 1 de X</div>
            <button id="hintBtn" style="margin-top: 10px; width: 100%; background: #444;" onclick="showHint()">Dame una pista</button>
        </div>
    </div>
</div>

<script>
    let board = null;
    let game = new Chess();
    let currentLesson = 0;
    let currentStep = 0;

    const lessons = [
        {
            title: "La Defensa Alekhine (Provocación)",
            desc: "Alekhine revolucionó el ajedrez con esta apertura. El negro permite que el blanco avance sus peones para luego atacarlos. <br><br><b>Tarea:</b> Juega 1... Cf6 para invitar al blanco a avanzar.",
            moves: ["e4", "Nf6"],
            hint: "Mueve el caballo de g8 a f6.",
            success: "¡Exacto! Al mover el Caballo, 'provocas' a las blancas a jugar e5. Alekhine prefería desequilibrar la posición desde la jugada 1."
        },
        {
            title: "Desarrollo con Ganancia de Tiempo",
            desc: "Alekhine nunca desarrollaba piezas de forma pasiva. Cada pieza debe entrar al juego creando una amenaza. <br><br><b>Contexto:</b> En esta posición de la Ruy López, el blanco acaba de enrocar. ¿Cómo desarrollas el alfil presionando?",
            setup: "r1bqk2r/pppp1ppp/2n2n2/1B2p3/4P3/5N2/PPPP1PPP/RNBQ1RK1 b kq - 5 4",
            moves: ["Bc5"],
            hint: "Mueve el alfil de f8 a una casilla que presione el centro y mire hacia el rey.",
            success: "Bien. Bc5 desarrolla una pieza y apunta directamente a la debilidad de f2. Desarrollo activo sobre seguridad estática."
        },
        {
            title: "La Iniciativa Central",
            desc: "Alekhine solía priorizar el control del centro mediante piezas incluso antes de enrocar. <br><br><b>Tarea:</b> El blanco domina e4. ¿Cómo ataca el negro ese centro de forma inmediata?",
            setup: "rnbqkb1r/pppppppp/5n2/4P3/8/8/PPPP1PPP/RNBQKBNR b KQkq - 0 2",
            moves: ["Nd5"],
            hint: "El peón de e5 ataca a tu caballo. Salta hacia el centro.",
            success: "Excelente. Nd5 no solo salva al caballo, sino que lo sitúa en una casilla dominante (puesto avanzado) desde donde controla el juego."
        },
        {
            title: "Preparando la Pistola de Alekhine",
            desc: "La famosa 'Pistola' consiste en alinear las torres y la dama. <br><br><b>Tarea:</b> Comienza la maniobra doblando torres en la columna 'c' abierta.",
            setup: "2r2rk1/pp1b1ppp/1q2pn2/3p4/8/P1NBP3/1PPQ1PPP/2R2RK1 w - - 0 1",
            moves: ["Rc2"],
            hint: "Mueve la torre de c1 a c2 para dejar espacio a la otra torre.",
            success: "¡Esa es la idea! Rc2 permite que la torre de f1 vaya a c1, y luego la dama a c2 o c1 detrás de ellas. ¡Poder de fuego máximo!"
        }
    ];

    function onDragStart (source, piece, position, orientation) {
        if (game.game_over()) return false;
        if (piece.search(/^w/) !== -1 && game.turn() === 'b') return false;
        if (piece.search(/^b/) !== -1 && game.turn() === 'w') return false;
    }

    function onDrop (source, target) {
        let lesson = lessons[currentLesson];
        let move = game.move({
            from: source,
            to: target,
            promotion: 'q'
        });

        if (move === null) return 'snapback';

        // Validar si el movimiento es el correcto para la lección
        let expectedMove = lesson.moves[currentStep + (game.turn() === 'w' ? 0 : 0)]; // Simplificado para el tutorial

        // En este tutorial el usuario siempre juega el lado que falta en el 'moves' array
        // Si es el primer movimiento de la lección y hay un setup, el usuario hace el primer move de la lista
        if (move.san === lesson.moves[0]) {
            updateStatus(lesson.success);
            document.getElementById('nextBtn').disabled = false;
        } else {
            game.undo();
            alert("Alekhine buscaría una jugada más enérgica. Intenta de nuevo.");
            return 'snapback';
        }

        updatePGN();
    }

    function updateStatus(msg) {
        document.getElementById('lesson-desc').innerHTML = `<span class="highlight-text">¡Muy bien!</span><br>${msg}`;
    }

    function updatePGN() {
        document.getElementById('pgn').innerHTML = "Movimientos: " + game.san(game.history().slice(-1)[0]);
    }

    function loadLesson(index) {
        currentLesson = index;
        currentStep = 0;
        let lesson = lessons[index];

        game = new Chess();
        if (lesson.setup) {
            game.load(lesson.setup);
        }

        document.getElementById('lesson-title').innerText = lesson.title;
        document.getElementById('lesson-desc').innerHTML = lesson.desc;
        document.getElementById('step-info').innerText = `Lección ${index + 1} de ${lessons.length}`;
        document.getElementById('nextBtn').disabled = true;
        document.getElementById('prevBtn').disabled = (index === 0);

        if (board) board.destroy();

        board = Chessboard('myBoard', {
            draggable: true,
            position: lesson.setup || 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            pieceTheme: 'https://raw.githubusercontent.com/oakmac/chessboardjs/master/website/img/chesspieces/wikipedia/{piece}.png'
        });
    }

    function nextLesson() {
        if (currentLesson < lessons.length - 1) {
            loadLesson(currentLesson + 1);
        } else {
            alert("¡Felicidades! Has completado el tutorial básico de Alekhine. Sigue practicando su agresividad posicional.");
        }
    }

    function prevLesson() {
        if (currentLesson > 0) {
            loadLesson(currentLesson - 1);
        }
    }

    function showHint() {
        alert("Pista: " + lessons[currentLesson].hint);
    }

    // Iniciar
    $(document).ready(function() {
        loadLesson(0);
    });
</script>

</body>
</html>
