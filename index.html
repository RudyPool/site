<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IGN Perú - Generador de Shapefiles</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        header { background: #003366; color: white; padding: 15px; text-align: center; }
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .btn-primary { background: #003366; margin-right: 10px; }
        .btn-shp { background: #d32f2f; }
        .btn:hover { opacity: 0.9; }
        #map { height: 400px; border-radius: 8px; border: 1px solid #ddd; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #003366; color: white; }
        .status { font-size: 12px; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h2>Instituto Geográfico Nacional - Exportador SHP</h2>
</header>

<div class="container">
    <div class="card">
        <div style="margin-bottom:10px;">
            <select id="modo" style="padding:8px;">
                <option value="geo2utm">Geográficas → UTM</option>
                <option value="utm2geo">UTM → Geográficas</option>
            </select>
            <label> Zona:</label> <input type="number" id="zona" value="18" style="width: 50px; padding:7px;">
            <select id="hem" style="padding:8px;">
                <option value="S">SUR</option>
                <option value="N">NORTE</option>
            </select>
        </div>
        <textarea id="entrada" placeholder="Pega coordenadas aquí..."></textarea>
        <div>
            <button class="btn btn-primary" onclick="procesar()">1. Transformar Puntos</button>
            <button class="btn btn-shp" onclick="descargarSHP()">2. Descargar SHP (.ZIP)</button>
        </div>
        <div id="status" class="status" style="color: orange;">Cargando motor...</div>
    </div>

    <div id="map"></div>

    <div class="card" style="overflow-x:auto;">
        <table id="tabla">
            <thead>
                <tr><th>ID</th><th>Latitud</th><th>Longitud</th><th>Este (X)</th><th>Norte (Y)</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/shp-write@0.3.2/shpwrite.js"></script>

<script>
    let puntosGlobal = [];
    const map = L.map('map').setView([-12.04, -77.03], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let capaMarcadores = L.layerGroup().addTo(map);

    // Verificación de motor
    window.onload = function() {
        if (typeof shpwrite !== 'undefined') {
            document.getElementById('status').innerText = "✅ Motor SHP listo";
            document.getElementById('status').style.color = "green";
        } else {
            document.getElementById('status').innerText = "❌ Error de carga. Refresca con F5";
            document.getElementById('status').style.color = "red";
        }
    };

    function procesar() {
        puntosGlobal = [];
        capaMarcadores.clearLayers();
        const texto = document.getElementById("entrada").value.trim();
        if(!texto) return alert("Ingresa coordenadas");

        const modo = document.getElementById("modo").value;
        const zona = document.getElementById("zona").value;
        const hem = document.getElementById("hem").value;
        const utmDef = `+proj=utm +zone=${zona} ${hem === 'S' ? '+south' : ''} +datum=WGS84 +units=m +no_defs`;
        
        let html = "";
        let bounds = [];

        texto.split("\n").forEach((linea, i) => {
            const c = linea.trim().split(/[\s,]+/);
            if(c.length < 2) return;
            
            let lat, lon, x, y;
            const id = i + 1;

            if(modo === "geo2utm") {
                lat = parseFloat(c[0]); lon = parseFloat(c[1]);
                const res = proj4("+proj=longlat +datum=WGS84", utmDef, [lon, lat]);
                x = res[0]; y = res[1];
            } else {
                x = parseFloat(c[0]); y = parseFloat(c[1]);
                const res = proj4(utmDef, "+proj=longlat +datum=WGS84", [x, y]);
                lon = res[0]; lat = res[1];
            }

            puntosGlobal.push({ id, lat, lon, x, y, zona: zona+hem });
            html += `<tr><td>${id}</td><td>${lat.toFixed(6)}</td><td>${lon.toFixed(6)}</td><td>${x.toFixed(2)}</td><td>${y.toFixed(2)}</td></tr>`;
            L.marker([lat, lon]).addTo(capaMarcadores).bindPopup("Punto " + id);
            bounds.push([lat, lon]);
        });

        document.querySelector("#tabla tbody").innerHTML = html;
        if(bounds.length) map.fitBounds(bounds);
    }

    function descargarSHP() {
        if (!puntosGlobal.length) return alert("Primero transforma los puntos");
        
        const geojson = {
            type: "FeatureCollection",
            features: puntosGlobal.map(p => ({
                type: "Feature",
                geometry: { type: "Point", coordinates: [p.lon, p.lat] },
                properties: { ID: p.id, X: p.x, Y: p.y, ZONA: p.zona }
            }))
        };

        try {
            // Esta es la llamada correcta para la versión 0.3.2
            shpwrite.download(geojson, {
                folder: 'IGN_Export',
                types: { point: 'puntos' }
            });
        } catch (err) {
            alert("Error al generar ZIP: " + err.message);
        }
    }
</script>
</body>
</html>
