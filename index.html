<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IGN Perú - Exportador SHP Oficial</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        header { background: #003366; color: white; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 15px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-map { background: #003366; }
        .btn-shp { background: #d32f2f; }
        #map { height: 350px; border-radius: 12px; margin-top: 15px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<header>
    <h1>Herramienta Web Institucional - IGN</h1>
    <p>Exportación Directa a Shapefile (.ZIP)</p>
</header>

<div class="container">
    <label>Coordenadas (Lat Lon):</label>
    <textarea id="coordsInput" placeholder="-12.0203 -77.0202"></textarea>
    <button class="btn btn-map" onclick="procesar()">1. VISUALIZAR EN MAPA</button>
    <button class="btn btn-shp" onclick="descargarSHP()">2. DESCARGAR SHAPEFILE (.ZIP)</button>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://rawgit.com/mapbox/shp-write/master/shpwrite.js"></script>

<script>
    let geojsonRef = null;
    const map = L.map('map').setView([-12.02, -77.02], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let layer = L.featureGroup().addTo(map);

    function procesar() {
        const texto = document.getElementById("coordsInput").value.trim();
        if(!texto) return alert("Ingrese datos");
        
        layer.clearLayers();
        const features = [];
        texto.split("\n").forEach((l, i) => {
            const c = l.trim().split(/[\s,]+/);
            if(c.length >= 2) {
                const lat = parseFloat(c[0]), lon = parseFloat(c[1]);
                features.push({
                    type: "Feature",
                    geometry: { type: "Point", coordinates: [lon, lat] },
                    properties: { ID: i+1, LAT: lat, LON: lon }
                });
                L.marker([lat, lon]).addTo(layer);
            }
        });
        
        geojsonRef = { type: "FeatureCollection", features: features };
        if(features.length > 0) map.fitBounds(layer.getBounds());
    }

    function descargarSHP() {
        if(!geojsonRef) return alert("Procese los puntos primero");

        // Intentamos acceder a la librería por múltiples nombres posibles
        const shp = window.shpwrite || window['shp-write'];

        if(!shp) {
            // FALLBACK CRÍTICO: Si la red bloquea RawGit, usamos un mensaje de diagnóstico
            console.error("Librería shp-write no detectada en window.");
            alert("Error: El motor de Shapefile sigue bloqueado por tu red institucional.\n\nSOLUCIÓN FINAL: Debes descargar el archivo 'shpwrite.js' de internet, subirlo a tu carpeta 'site' en GitHub y llamarlo así: <script src='shpwrite.js'>");
            return;
        }

        try {
            shp.download(geojsonRef, {
                folder: 'IGN_EXPORT',
                types: { point: 'puntos_ign' }
            });
        } catch (e) {
            alert("Error de compresión: " + e.message);
        }
    }
</script>
</body>
</html>
