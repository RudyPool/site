<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IGN Perú - Exportador SHP Final</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #f4f7f6; }
        header { background: #003366; color: white; padding: 15px; text-align: center; }
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .btn-primary { background: #003366; margin-right: 10px; }
        .btn-shp { background: #d32f2f; }
        .btn:hover { opacity: 0.85; transform: scale(1.02); }
        #map { height: 400px; border-radius: 8px; border: 1px solid #ddd; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; font-size: 13px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #003366; color: white; }
    </style>
</head>
<body>

<header>
    <strong>INSTITUTO GEOGRÁFICO NACIONAL</strong> - Transformador y Exportador
</header>

<div class="container">
    <div class="card">
        <div style="margin-bottom:10px;">
            <select id="modo" style="padding:8px;">
                <option value="geo2utm">Geográficas → UTM</option>
                <option value="utm2geo">UTM → Geográficas</option>
            </select>
            <label> Zona:</label> <input type="number" id="zona" value="18" style="width: 50px; padding:7px;">
            <select id="hem" style="padding:8px;">
                <option value="S">SUR</option>
                <option value="N">NORTE</option>
            </select>
        </div>
        <textarea id="entrada" placeholder="Latitud Longitud (ejemplo):&#10;-12.0459 -77.0305"></textarea>
        <div>
            <button class="btn btn-primary" onclick="procesar()">1. Transformar Puntos</button>
            <button class="btn btn-shp" onclick="exportarZIP()">2. Descargar SHP (.ZIP)</button>
        </div>
    </div>

    <div id="map"></div>

    <div class="card">
        <table id="tabla">
            <thead>
                <tr><th>Punto</th><th>Latitud</th><th>Longitud</th><th>Este (X)</th><th>Norte (Y)</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shp-write@0.3.2/shpwrite.js"></script>

<script>
    let puntosGlobal = [];
    const map = L.map('map').setView([-12.04, -77.03], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let capaMarcadores = L.layerGroup().addTo(map);

    function procesar() {
        puntosGlobal = [];
        capaMarcadores.clearLayers();
        const texto = document.getElementById("entrada").value.trim();
        if(!texto) return alert("Ingresa datos");

        const modo = document.getElementById("modo").value;
        const zona = document.getElementById("zona").value;
        const hem = document.getElementById("hem").value;
        const utmDef = `+proj=utm +zone=${zona} ${hem === 'S' ? '+south' : ''} +datum=WGS84 +units=m +no_defs`;
        
        let html = "";
        let bounds = [];

        texto.split("\n").forEach((linea, i) => {
            const c = linea.trim().split(/\s+/);
            if(c.length < 2) return;
            
            let lat, lon, x, y;
            if(modo === "geo2utm") {
                lat = parseFloat(c[0]); lon = parseFloat(c[1]);
                const res = proj4("+proj=longlat +datum=WGS84", utmDef, [lon, lat]);
                x = res[0]; y = res[1];
            } else {
                x = parseFloat(c[0]); y = parseFloat(c[1]);
                const res = proj4(utmDef, "+proj=longlat +datum=WGS84", [x, y]);
                lon = res[0]; lat = res[1];
            }

            puntosGlobal.push({ id: i+1, lat, lon, x, y, zona: zona+hem });
            html += `<tr><td>${i+1}</td><td>${lat.toFixed(6)}</td><td>${lon.toFixed(6)}</td><td>${x.toFixed(2)}</td><td>${y.toFixed(2)}</td></tr>`;
            L.marker([lat, lon]).addTo(capaMarcadores);
            bounds.push([lat, lon]);
        });

        document.querySelector("#tabla tbody").innerHTML = html;
        if(bounds.length) map.fitBounds(bounds);
    }

    function exportarZIP() {
        if (!puntosGlobal.length) return alert("Transforma los puntos primero.");

        const geojson = {
            type: "FeatureCollection",
            features: puntosGlobal.map(p => ({
                type: "Feature",
                geometry: { type: "Point", coordinates: [p.lon, p.lat] },
                properties: { ID: p.id, X: p.x.toFixed(2), Y: p.y.toFixed(2), ZONA: p.zona }
            }))
        };

        try {
            // Usamos la función de descarga directa que incluye la corrección de compresión
            shpwrite.download(geojson, {
                folder: 'Puntos_IGN',
                types: { point: 'Export_SHP' }
            });
        } catch (e) {
            console.error(e);
            alert("Error al comprimir: " + e.message + ". Intenta refrescar con Ctrl+F5.");
        }
    }
</script>
</body>
</html>
