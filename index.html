<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IGN Perú - Exportador de Coordenadas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        header { background: #003366; color: white; padding: 15px; text-align: center; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; margin: 10px 0; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-primary { background: #003366; }
        .btn-success { background: #28a745; margin-left: 10px; }
        #map { height: 300px; margin-top: 15px; border-radius: 8px; }
    </style>
</head>
<body>

<header><h1>IGN Perú - Conversor de Datos</h1></header>

<div class="container">
    <div class="card">
        <label for="entrada">Pega tus coordenadas (Lat Lon):</label>
        <textarea id="entrada" placeholder="-12.04 -77.03"></textarea>
        <button class="btn btn-primary" onclick="procesar()">1. Procesar</button>
        <button class="btn btn-success" onclick="descargarCSV()">2. Descargar para ArcGIS/QGIS (.CSV)</button>
        <div id="map"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let datosCargados = [];
    const map = L.map('map').setView([-12.04, -77.03], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    function procesar() {
        datosCargados = [];
        const texto = document.getElementById("entrada").value.trim();
        const utmDef = "+proj=utm +zone=18 +south +datum=WGS84 +units=m +no_defs";
        
        texto.split("\n").forEach((linea, i) => {
            const c = linea.trim().split(/\s+/);
            if(c.length < 2) return;
            const lat = parseFloat(c[0]), lon = parseFloat(c[1]);
            const res = proj4("+proj=longlat +datum=WGS84", utmDef, [lon, lat]);
            
            datosCargados.push({ id: i+1, lat, lon, x: res[0].toFixed(2), y: res[1].toFixed(2) });
            L.marker([lat, lon]).addTo(map);
        });
        alert("Puntos procesados correctamente.");
    }

    function descargarCSV() {
        if (datosCargados.length === 0) return alert("Procesa los datos primero.");
        
        // Cabecera compatible con cualquier software GIS
        let csvContent = "ID,LATITUD,LONGITUD,ESTE_X,NORTE_Y,ZONA\n";
        datosCargados.forEach(p => {
            csvContent += `${p.id},${p.lat},${p.lon},${p.x},${p.y},18S\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "puntos_ign_peru.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
