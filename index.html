<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IGN Perú - Exportador SHP Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        header { background: #003366; color: white; padding: 15px; text-align: center; }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; margin-top: 10px; }
        .btn-primary { background: #003366; margin-right: 10px; }
        .btn-shp { background: #d32f2f; }
        #map { height: 350px; border-radius: 8px; border: 1px solid #ddd; margin-top: 20px; }
        .input-group { display: inline-block; margin-right: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

<header>
    <h2>IGN Perú - Generador Shapefile ZIP</h2>
</header>

<div class="container">
    <div class="card">
        <div class="input-group">
            <label for="modo">Modo:</label>
            <select id="modo">
                <option value="geo2utm">Lat/Lon → UTM</option>
                <option value="utm2geo">UTM → Lat/Lon</option>
            </select>
        </div>
        <div class="input-group">
            <label for="zona">Zona:</label>
            <input type="number" id="zona" value="18" style="width: 40px;">
        </div>
        <textarea id="entrada" placeholder="-12.04 -77.03" style="margin-top:10px;"></textarea>
        <div>
            <button class="btn btn-primary" onclick="procesar()">1. Procesar</button>
            <button class="btn btn-shp" onclick="descargarSHP()">2. Descargar SHP (.ZIP)</button>
        </div>
    </div>
    <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/shp-write@0.3.2/shpwrite.js"></script>

<script>
    let puntosGlobal = [];
    const map = L.map('map').setView([-12.04, -77.03], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let capa = L.layerGroup().addTo(map);

    function procesar() {
        puntosGlobal = [];
        capa.clearLayers();
        const texto = document.getElementById("entrada").value.trim();
        const modo = document.getElementById("modo").value;
        const zona = document.getElementById("zona").value;
        const utmDef = `+proj=utm +zone=${zona} +south +datum=WGS84 +units=m +no_defs`;
        
        texto.split("\n").forEach((linea, i) => {
            const c = linea.trim().split(/\s+/);
            if(c.length < 2) return;
            let lat, lon, x, y;
            if(modo === "geo2utm") {
                lat = parseFloat(c[0]); lon = parseFloat(c[1]);
                const res = proj4("+proj=longlat +datum=WGS84", utmDef, [lon, lat]);
                x = res[0]; y = res[1];
            } else {
                x = parseFloat(c[0]); y = parseFloat(c[1]);
                const res = proj4(utmDef, "+proj=longlat +datum=WGS84", [x, y]);
                lon = res[0]; lat = res[1];
            }
            puntosGlobal.push({ id: i+1, lat, lon, x, y });
            L.marker([lat, lon]).addTo(capa);
        });
        if(puntosGlobal.length) map.fitBounds(capa.getLayers().map(l => l.getLatLng()));
    }

    function descargarSHP() {
        if (!puntosGlobal.length) return alert("Procesa los puntos primero");

        // Estructura GeoJSON para convertir
        const geojson = {
            type: "FeatureCollection",
            features: puntosGlobal.map(p => ({
                type: "Feature",
                geometry: { type: "Point", coordinates: [p.lon, p.lat] },
                properties: { 
                    ID: p.id, 
                    ESTE: parseFloat(p.x.toFixed(2)), 
                    NORTE: parseFloat(p.y.toFixed(2)) 
                }
            }))
        };

        try {
            // shpwrite.download gestiona internamente la creación de .shp, .dbf, .prj y el .zip
            shpwrite.download(geojson, {
                folder: 'Puntos_IGN_Peru',
                types: { point: 'puntos_ign' }
            });
        } catch (err) {
            console.error(err);
            alert("Error al generar el ZIP: " + err.message);
        }
    }
</script>
</body>
</html>
