<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IGN Perú - Exportador SHP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #f0f2f5; }
        header { background: #003366; color: white; padding: 15px; text-align: center; }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .btn-primary { background: #003366; margin-right: 10px; }
        .btn-shp { background: #d32f2f; }
        #map { height: 350px; border-radius: 8px; border: 1px solid #ddd; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #003366; color: white; }
        .input-group { display: inline-block; margin-right: 15px; margin-bottom: 10px; }
        label { font-weight: bold; display: block; font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>

<header>
    <strong>INSTITUTO GEOGRÁFICO NACIONAL</strong> - Exportador SHP
</header>

<div class="container">
    <div class="card">
        <div class="input-group">
            <label for="modo">Modo de Conversión:</label>
            <select id="modo" style="padding:6px;">
                <option value="geo2utm">Geográficas → UTM</option>
                <option value="utm2geo">UTM → Geográficas</option>
            </select>
        </div>

        <div class="input-group">
            <label for="zona">Zona UTM:</label>
            <input type="number" id="zona" value="18" style="width: 50px; padding:5px;">
        </div>

        <div class="input-group">
            <label for="hem">Hemisferio:</label>
            <select id="hem" style="padding:6px;">
                <option value="S">SUR</option>
                <option value="N">NORTE</option>
            </select>
        </div>

        <label for="entrada">Coordenadas (Ej: -12.04 -77.03):</label>
        <textarea id="entrada" placeholder="Pegue sus coordenadas aquí..."></textarea>
        
        <div>
            <button class="btn btn-primary" onclick="procesar()">1. Transformar Puntos</button>
            <button class="btn btn-shp" onclick="exportarSHP()">2. Descargar SHP (.ZIP)</button>
        </div>
    </div>

    <div id="map"></div>

    <div class="card" style="overflow-x:auto;">
        <table id="tabla">
            <thead>
                <tr><th>Punto</th><th>Latitud</th><th>Longitud</th><th>Este (X)</th><th>Norte (Y)</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://raw.githack.com/mapbox/shp-write/master/shpwrite.js"></script>

<script>
    let puntosGlobal = [];
    const map = L.map('map').setView([-12.04, -77.03], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let capaMarcadores = L.layerGroup().addTo(map);

    function procesar() {
        puntosGlobal = [];
        capaMarcadores.clearLayers();
        const texto = document.getElementById("entrada").value.trim();
        if(!texto) return alert("Por favor, ingrese coordenadas.");

        const modo = document.getElementById("modo").value;
        const zona = document.getElementById("zona").value;
        const hem = document.getElementById("hem").value;
        const utmDef = `+proj=utm +zone=${zona} ${hem === 'S' ? '+south' : ''} +datum=WGS84 +units=m +no_defs`;
        
        let html = "";
        let bounds = [];

        texto.split("\n").forEach((linea, i) => {
            const c = linea.trim().split(/\s+/);
            if(c.length < 2) return;
            let lat, lon, x, y;
            if(modo === "geo2utm") {
                lat = parseFloat(c[0]); lon = parseFloat(c[1]);
                const res = proj4("+proj=longlat +datum=WGS84", utmDef, [lon, lat]);
                x = res[0]; y = res[1];
            } else {
                x = parseFloat(c[0]); y = parseFloat(c[1]);
                const res = proj4(utmDef, "+proj=longlat +datum=WGS84", [x, y]);
                lon = res[0]; lat = res[1];
            }
            puntosGlobal.push({ id: i+1, lat, lon, x, y, zona: zona+hem });
            html += `<tr><td>${i+1}</td><td>${lat.toFixed(6)}</td><td>${lon.toFixed(6)}</td><td>${x.toFixed(2)}</td><td>${y.toFixed(2)}</td></tr>`;
            L.marker([lat, lon]).addTo(capaMarcadores);
            bounds.push([lat, lon]);
        });
        document.querySelector("#tabla tbody").innerHTML = html;
        if(bounds.length) map.fitBounds(bounds);
    }

    function exportarSHP() {
        if (!puntosGlobal.length) return alert("Transforme los puntos primero.");

        const geojson = {
            type: "FeatureCollection",
            features: puntosGlobal.map(p => ({
                type: "Feature",
                geometry: { type: "Point", coordinates: [p.lon, p.lat] },
                properties: { ID: p.id, X: p.x.toFixed(2), Y: p.y.toFixed(2) }
            }))
        };

        try {
            // Intentamos la descarga usando la librería cargada
            if (typeof shpwrite !== 'undefined') {
                shpwrite.download(geojson, {
                    folder: 'IGN_SHP',
                    types: { point: 'export_puntos' }
                });
            } else {
                alert("Error: El motor de descarga no cargó. Intente refrescar la página.");
            }
        } catch (e) {
            console.error(e);
            alert("Error de compresión: " + e.message + "\n\nPor favor, intente en una ventana de INCÓGNITO para evitar errores de caché.");
        }
    }
</script>
</body>
</html>
