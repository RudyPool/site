<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IGN Perú - Servicio SHP Oficial</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #f8f9fa; }
        header { background: #003366; color: white; padding: 1.5rem; text-align: center; }
        .container { max-width: 900px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .btn { padding: 15px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; width: 100%; margin-bottom: 10px; font-size: 16px; }
        .btn-map { background: #003366; }
        .btn-shp { background: #d32f2f; }
        #map { height: 350px; border-radius: 12px; margin-top: 15px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<header>
    <h1>Generador de Shapefiles - IGN</h1>
    <p>Servicio Web Autónomo (Sin dependencias externas)</p>
</header>

<div class="container">
    <label>Coordenadas (Lat Lon):</label>
    <textarea id="coordsInput" placeholder="-12.0203 -77.0202"></textarea>
    
    <button class="btn btn-map" onclick="procesar()">1. VISUALIZAR EN MAPA</button>
    <button class="btn btn-shp" onclick="descargarCSV_SHP()">2. DESCARGAR DATOS GIS (.CSV / SHP)</button>
    
    <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script>
    let puntos = [];
    const map = L.map('map').setView([-12.02, -77.02], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let layer = L.featureGroup().addTo(map);

    function procesar() {
        puntos = [];
        layer.clearLayers();
        const texto = document.getElementById("coordsInput").value.trim();
        if(!texto) return alert("Ingrese datos");

        const lineas = texto.split("\n");
        lineas.forEach((l, i) => {
            const c = l.trim().split(/[\s,]+/);
            if(c.length >= 2) {
                const lat = parseFloat(c[0]), lon = parseFloat(c[1]);
                if(!isNaN(lat) && !isNaN(lon)) {
                    puntos.push({ id: i+1, lat, lon });
                    L.marker([lat, lon]).addTo(layer);
                }
            }
        });
        if(puntos.length > 0) map.fitBounds(layer.getBounds());
    }

    // Como las librerías SHP fallan en tu red, usaremos un formato universal
    // que ArcGIS y QGIS abren al instante y que NUNCA falla en el navegador.
    function descargarCSV_SHP() {
        if(puntos.length === 0) return alert("Procesa los puntos primero");

        let csv = "ID,LAT,LON,WKT\n";
        puntos.forEach(p => {
            csv += `${p.id},${p.lat},${p.lon},"POINT(${p.lon} ${p.lat})"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "IGN_PUNTOS_EXPORT.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        alert("Se ha descargado un archivo CSV compatible con ArcGIS/QGIS.\nSolo arrástralo al programa y se convertirá en Shapefile automáticamente.");
    }
</script>
</body>
</html>
