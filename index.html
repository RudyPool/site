<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Primeros Colores - Catalina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-pink: #FF6B9D;
            --p-blue: #60A5FA;
            --p-yellow: #FACC15;
            --p-bg: #FFF9FB;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #FFEDF2;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .app-shell {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: var(--p-bg);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 100px rgba(255, 107, 157, 0.2);
            overflow: hidden;
        }

        @media (min-width: 500px) {
            .app-shell { 
                border-radius: 48px; 
                height: 92vh; 
                max-height: 900px;
                border: 10px solid #FFFFFF; 
            }
        }

        .screen { 
            display: none; 
            height: 100%; 
            width: 100%; 
            flex-direction: column; 
            animation: fadeIn 0.4s ease-out; 
        }
        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .btn-big {
            background: var(--p-pink);
            color: white;
            border-radius: 35px;
            padding: clamp(15px, 4vh, 25px);
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            font-family: 'Fredoka', sans-serif;
            border-bottom: 10px solid #D81B60;
            transition: all 0.1s;
            text-align: center;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 15px 25px rgba(216, 27, 96, 0.2);
        }
        .btn-big:active { transform: translateY(6px); border-bottom-width: 4px; }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(10px, 3vh, 20px);
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .color-bubble {
            aspect-ratio: 1;
            border-radius: 35px;
            border: clamp(4px, 1.5vw, 8px) solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .color-bubble:active { transform: scale(0.9); }

        .house-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 0;
        }

        .house-main {
            width: clamp(150px, 35vh, 240px);
            height: clamp(150px, 35vh, 240px);
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.1));
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes jump {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3) translateY(-15px); }
        }
        .house-jump { animation: jump 0.6s ease; }

        .audio-waves {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 3px;
            height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .audio-waves.active { opacity: 1; }
        .wave-bar {
            width: 4px;
            background: var(--p-pink);
            border-radius: 2px;
            animation: wave-anim 1s ease-in-out infinite;
        }
        @keyframes wave-anim {
            0%, 100% { height: 5px; }
            50% { height: 20px; }
        }

        .house-label {
            margin-top: 10px;
            background: white;
            padding: 5px 25px;
            border-radius: 20px;
            font-weight: bold;
            color: #FF6B9D;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
            font-size: clamp(0.8rem, 3vw, 1rem);
        }

        .nav-top {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stars-badge {
            background: white;
            padding: 8px 20px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 3px solid #FFEDF2;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div class="app-shell">
    <!-- HOME -->
    <div id="screen-home" class="screen active p-8 justify-between text-center">
        <div class="pt-6">
            <h1 class="text-3xl font-bold text-pink-500 mb-1 font-game uppercase tracking-tighter">Mis Colores</h1>
            <p class="text-pink-400 font-bold text-lg leading-tight">Aprende jugando con Catalina</p>
        </div>

        <div class="house-stage flex-col">
            <div id="home-house" class="house-main"></div>
            <div class="audio-waves" id="home-audio-indicator">
                <div class="wave-bar" style="animation-delay: 0.1s"></div>
                <div class="wave-bar" style="animation-delay: 0.3s"></div>
                <div class="wave-bar" style="animation-delay: 0.2s"></div>
                <div class="wave-bar" style="animation-delay: 0.4s"></div>
            </div>
            <div id="house-name" class="house-label">Casita Mágica</div>
        </div>

        <div class="w-full space-y-4 mb-8">
            <button id="btn-start" onclick="initAudioAndGo()" class="btn-big">¡EMPEZAR! 💖</button>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-4">Toca el botón para jugar con Catalina</p>
        </div>
    </div>

    <!-- MAPA -->
    <div id="screen-map" class="screen bg-sky-50 p-6 overflow-y-auto no-scrollbar">
        <div class="nav-top">
            <button onclick="changeScreen('screen-home')" class="text-4xl bg-white p-2 rounded-2xl shadow-sm border">🏠</button>
            <div class="stars-badge">
                <span class="text-yellow-400 text-2xl">⭐</span>
                <span id="map-stars" class="font-game text-2xl text-pink-600">0</span>
            </div>
            <div class="w-12"></div>
        </div>

        <div class="flex-1 flex flex-col justify-center space-y-6 pb-10 max-w-[320px] mx-auto">
            <div onclick="startMode('explore')" class="btn-big bg-teal-400 border-teal-600">
                <p class="text-xs opacity-80 uppercase mb-1">Paso 1</p>
                <p>EXPLORAR</p>
                <span class="text-[10px] font-bold block mt-1 uppercase text-white">Toca y escucha</span>
            </div>
            <div onclick="startMode('game')" class="btn-big bg-purple-400 border-purple-600">
                <p class="text-xs opacity-80 uppercase mb-1">Paso 2</p>
                <p>ADIVINAR</p>
                <span class="text-[10px] font-bold block mt-1 uppercase text-white">¿Dónde está...?</span>
            </div>
        </div>
    </div>

    <!-- PANTALLA JUEGO -->
    <div id="screen-play" class="screen bg-white">
        <div class="nav-top border-b">
            <button onclick="changeScreen('screen-map')" class="text-xl font-bold text-gray-400 px-4">ATRÁS</button>
            <div class="stars-badge">
                <span class="text-yellow-400 text-xl">⭐</span>
                <span id="play-stars" class="font-bold text-pink-500">0</span>
            </div>
        </div>

        <div id="instruction-bar" class="p-4 bg-pink-50 text-pink-600 text-center font-bold text-lg leading-tight">
            ¡Catalina, toca los colores!
        </div>

        <div class="color-grid no-scrollbar" id="color-container"></div>

        <div class="p-4 flex flex-col items-center bg-white border-t">
            <div id="play-house" class="w-20 h-20"></div>
            <div class="audio-waves mt-2" id="play-audio-indicator">
                <div class="wave-bar" style="animation-delay: 0.1s"></div>
                <div class="wave-bar" style="animation-delay: 0.3s"></div>
                <div class="wave-bar" style="animation-delay: 0.2s"></div>
                <div class="wave-bar" style="animation-delay: 0.4s"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- NUEVO MOTOR DE VOZ (WEB SPEECH API) ---
    // No necesita API KEY, funciona en cualquier navegador
    const VoiceEngine = {
        isSpeaking: false,
        synth: window.speechSynthesis,

        speak: (text) => {
            if (VoiceEngine.isSpeaking) VoiceEngine.synth.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 0.9; // Un poco más lento para niños
            utterance.pitch = 1.2; // Un poco más agudo/dulce

            // Mostrar indicadores visuales
            const indicators = [
                document.getElementById('home-audio-indicator'),
                document.getElementById('play-audio-indicator')
            ];
            
            utterance.onstart = () => {
                VoiceEngine.isSpeaking = true;
                indicators.forEach(ind => ind && ind.classList.add('active'));
            };

            utterance.onend = () => {
                VoiceEngine.isSpeaking = false;
                indicators.forEach(ind => ind && ind.classList.remove('active'));
            };

            VoiceEngine.synth.speak(utterance);
        }
    };

    // --- MOTOR DE LA CASITA ---
    const HouseEngine = {
        render: (points) => {
            let level = points > 1000 ? 5 : points > 600 ? 4 : points > 300 ? 3 : points > 100 ? 2 : 1;
            const labels = ["Cabaña", "Casita", "Hogar", "Mansión", "Castillo"];
            const colors = ["#d2b48c", "#ffccbc", "#bbdefb", "#f8bbd0", "#e1bee7"];
            let svg = `<ellipse cx="50" cy="85" rx="40" ry="10" fill="#e2e8f0"/>`;

            if (level === 1) svg += `<rect x="30" y="50" width="40" height="35" fill="${colors[0]}" stroke="#8d6e63" stroke-width="2"/><path d="M25 50 L50 25 L75 50 Z" fill="#8d6e63"/><rect x="45" y="65" width="10" height="20" fill="#5d4037"/>`;
            else if (level === 2) svg += `<rect x="25" y="45" width="50" height="40" rx="4" fill="${colors[1]}" stroke="#e64a19" stroke-width="2"/><path d="M20 45 L50 15 L80 45 Z" fill="#e64a19"/><rect x="42" y="60" width="16" height="25" fill="#795548"/><rect x="32" y="52" width="8" height="8" fill="#fff" stroke="#e64a19"/>`;
            else if (level === 3) svg += `<rect x="20" y="40" width="60" height="45" rx="4" fill="${colors[2]}" stroke="#1976d2" stroke-width="2"/><path d="M15 40 L50 10 L85 40 Z" fill="#1976d2"/><rect x="42" y="55" width="16" height="30" fill="#5d4037"/><rect x="28" y="48" width="10" height="10" fill="#fff" stroke="#1976d2"/><rect x="62" y="48" width="10" height="10" fill="#fff" stroke="#1976d2"/>`;
            else if (level === 4) svg += `<rect x="15" y="30" width="70" height="55" rx="6" fill="${colors[3]}" stroke="#c2185b" stroke-width="2"/><rect x="40" y="15" width="30" height="40" fill="${colors[3]}" stroke="#c2185b" stroke-width="2"/><path d="M10 30 L40 5 L75 30 Z" fill="#c2185b"/><rect x="42" y="55" width="16" height="30" fill="#333"/>`;
            else svg += `<rect x="20" y="30" width="60" height="55" fill="${colors[4]}" stroke="#7b1fa2" stroke-width="2"/><rect x="10" y="40" width="20" height="45" fill="#ce93d8" stroke="#7b1fa2" stroke-width="2"/><rect x="70" y="40" width="20" height="45" fill="#ce93d8" stroke="#7b1fa2" stroke-width="2"/><path d="M10 40 L20 20 L30 40 Z" fill="#7b1fa2"/><path d="M70 40 L80 20 L90 40 Z" fill="#7b1fa2"/><path d="M20 30 L50 5 L80 30 Z" fill="#7b1fa2"/><circle cx="50" cy="20" r="5" fill="#fde047" opacity="0.8"/>`;

            return { html: `<svg viewBox="0 0 100 100" class="w-full h-full" preserveAspectRatio="xMidYMid meet">${svg}</svg>`, label: labels[level-1] };
        }
    };

    const ColorsData = [
        { name: "Rojo", hex: "#EF4444" }, { name: "Azul", hex: "#3B82F6" },
        { name: "Amarillo", hex: "#FACC15" }, { name: "Verde", hex: "#22C55E" },
        { name: "Naranja", hex: "#FB923C" }, { name: "Morado", hex: "#A855F7" },
        { name: "Rosa", hex: "#F472B6" }, { name: "Marrón", hex: "#78350F" }
    ];

    let state = { points: parseInt(localStorage.getItem('catuColPoints')) || 0, mode: 'explore', targetColor: null };

    function updateUI() {
        const houseData = HouseEngine.render(state.points);
        document.getElementById('home-house').innerHTML = houseData.html;
        document.getElementById('house-name').innerText = houseData.label + " de Catalina";
        if(document.getElementById('play-house')) document.getElementById('play-house').innerHTML = houseData.html;
        document.getElementById('map-stars').innerText = state.points;
        document.getElementById('play-stars').innerText = state.points;
    }

    function changeScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        updateUI();
    }

    async function initAudioAndGo() {
        VoiceEngine.speak("¡Hola Catalina! Vamos a jugar con los colores.");
        changeScreen('screen-map');
    }

    function startMode(m) {
        state.mode = m;
        const cont = document.getElementById('color-container');
        cont.innerHTML = '';
        if(m === 'game') newQuestion();
        else document.getElementById('instruction-bar').innerText = "¡Catalina, toca un color!";

        ColorsData.forEach(c => {
            const bubble = document.createElement('div');
            bubble.className = "color-bubble";
            bubble.style.backgroundColor = c.hex;
            bubble.onclick = () => handleColorClick(c);
            cont.appendChild(bubble);
        });
        changeScreen('screen-play');
    }

    function handleColorClick(c) {
        VoiceEngine.speak(c.name);

        if(state.mode === 'game') {
            if(c.name === state.targetColor.name) {
                state.points += 25;
                localStorage.setItem('catuColPoints', state.points);
                document.getElementById('instruction-bar').innerText = "¡MUY BIEN, CATALINA! 🌟";
                setTimeout(() => VoiceEngine.speak("¡Eso es, Catalina! ¡Muy bien!"), 500);
                const ph = document.getElementById('play-house');
                if(ph) { ph.classList.add('house-jump'); setTimeout(() => ph.classList.remove('house-jump'), 600); }
                setTimeout(() => { newQuestion(); updateUI(); }, 2500);
            } else {
                setTimeout(() => VoiceEngine.speak("Catalina, ¿dónde está el color " + state.targetColor.name + "?"), 800);
            }
        }
    }

    function newQuestion() {
        state.targetColor = ColorsData[Math.floor(Math.random() * ColorsData.length)];
        document.getElementById('instruction-bar').innerText = "¿Dónde está el " + state.targetColor.name + "?";
        setTimeout(() => VoiceEngine.speak("Catalina, ¿puedes tocar el color " + state.targetColor.name + "?"), 400);
    }

    updateUI();
</script>

</body>
</html>
