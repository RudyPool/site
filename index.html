<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>IGN Perú - Exportador SHP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: #f4f7f6;
        }

        header {
            background: #003366;
            color: white;
            padding: 10px;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 80px;
            margin: 10px 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            margin-right: 5px;
        }

        .btn-primary {
            background: #003366;
        }

        .btn-shp {
            background: #d32f2f;
        }

        #map {
            height: 300px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <header>
        <h2>IGN Perú - Transformador de Coordenadas</h2>
    </header>

    <div class="container">
        <div class="card">
            <select id="modo">
                <option value="geo2utm">Geográficas → UTM</option>
                <option value="utm2geo">UTM → Geográficas</option>
            </select>
            <label> Zona:</label> <input type="number" id="zona" value="18" style="width: 40px;">
            <select id="hem">
                <option value="S">Sur</option>
                <option value="N">Norte</option>
            </select>
            <textarea id="entrada" placeholder="-12.0464 -77.0306"></textarea>
            <button class="btn btn-primary" onclick="procesar()">1. Transformar</button>
            <button class="btn btn-shp" onclick="exportarSHP()">2. Descargar SHP (ZIP)</button>
        </div>

        <div class="card">
            <div id="map"></div>
            <table id="tabla">
                <thead>
                    <tr>
                        <th>Punto</th>
                        <th>Lat</th>
                        <th>Lon</th>
                        <th>Este (X)</th>
                        <th>Norte (Y)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://raw.githack.com/mapbox/shp-write/master/shpwrite.js"></script>

    <script>
        let puntos = [];
        let map = L.map('map').setView([-12.04, -77.03], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let capaPuntos = L.layerGroup().addTo(map);

        function procesar() {
            puntos = [];
            capaPuntos.clearLayers();
            const texto = document.getElementById("entrada").value.trim();
            if (!texto) return;

            const modo = document.getElementById("modo").value;
            const zona = document.getElementById("zona").value;
            const hem = document.getElementById("hem").value;
            const utmDef = `+proj=utm +zone=${zona} ${hem === 'S' ? '+south' : ''} +datum=WGS84 +units=m +no_defs`;

            let html = "";
            let bounds = [];

            texto.split("\n").forEach((linea, i) => {
                const c = linea.trim().split(/\s+/);
                if (c.length < 2) return;
                let lat, lon, x, y;

                if (modo === "geo2utm") {
                    lat = parseFloat(c[0]); lon = parseFloat(c[1]);
                    const res = proj4("+proj=longlat +datum=WGS84", utmDef, [lon, lat]);
                    x = res[0]; y = res[1];
                } else {
                    x = parseFloat(c[0]); y = parseFloat(c[1]);
                    const res = proj4(utmDef, "+proj=longlat +datum=WGS84", [x, y]);
                    lon = res[0]; lat = res[1];
                }

                puntos.push({ id: i + 1, lat, lon, x, y, zona: zona + hem });
                html += `<tr><td>${i + 1}</td><td>${lat.toFixed(6)}</td><td>${lon.toFixed(6)}</td><td>${x.toFixed(2)}</td><td>${y.toFixed(2)}</td></tr>`;
                L.marker([lat, lon]).addTo(capaPuntos);
                bounds.push([lat, lon]);
            });

            document.querySelector("#tabla tbody").innerHTML = html;
            if (bounds.length) map.fitBounds(bounds);
        }

        function exportarSHP() {
            if (!puntos.length) return alert("Transforma los puntos primero.");

            const geojson = {
                type: "FeatureCollection",
                features: puntos.map(p => ({
                    type: "Feature",
                    geometry: { type: "Point", coordinates: [p.lon, p.lat] },
                    properties: { ID: p.id, X: p.x, Y: p.y, ZONA: p.zona }
                }))
            };

            try {
                // Usamos la librería cargada globalmente
                window.shpwrite.download(geojson, {
                    folder: 'Puntos_IGN',
                    types: { point: 'Export_IGN' }
                });
            } catch (e) {
                alert("Error: GitHub está bloqueando la descarga. Intenta abrirlo en modo Incógnito o revisa tu conexión.");
                console.error(e);
            }
        }
    </script>
</body>

</html>
