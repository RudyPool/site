<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGN Perú - Servicio de Exportación SHP</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --ign-blue: #003366; --ign-red: #d32f2f; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #f8f9fa; color: #333; }
        header { background: var(--ign-blue); color: white; padding: 1.5rem; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { max-width: 900px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        label { font-weight: bold; display: block; margin-bottom: 10px; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: monospace; font-size: 14px; }
        .btn-group { margin-top: 15px; }
        .btn { padding: 15px 25px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; width: 100%; font-size: 16px; margin-bottom: 10px; transition: 0.3s; }
        .btn-map { background: var(--ign-blue); }
        .btn-shp { background: var(--ign-red); }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        #map { height: 400px; border-radius: 12px; margin-top: 20px; border: 1px solid #ccc; }
        footer { text-align: center; padding: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

<header>
    <h1>Herramienta Web Institucional - IGN</h1>
    <p>Conversor de Coordenadas a Shapefile (.ZIP)</p>
</header>

<div class="container">
    <label>Pega tus coordenadas (Latitud Longitud):</label>
    <textarea id="coordsInput" placeholder="-12.0203 -77.0202&#10;-12.0303 -77.0303"></textarea>
    
    <div class="btn-group">
        <button class="btn btn-map" onclick="procesarPuntos()">1. VISUALIZAR EN MAPA</button>
        <button class="btn btn-shp" onclick="descargarSHP()">2. DESCARGAR SHAPEFILE (.ZIP)</button>
    </div>

    <div id="map"></div>
</div>

<footer>
    © 2026 Instituto Geográfico Nacional - Perú | Soporte Técnico GIS
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/2.5.0/jszip.min.js"></script>

<script src="shpwrite.js"></script>

<script>
    let geojsonGlobal = null;
    const map = L.map('map').setView([-12.02, -77.02], 12);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let capaPuntos = L.featureGroup().addTo(map);

    function procesarPuntos() {
        const rawText = document.getElementById("coordsInput").value.trim();
        if (!rawText) return alert("Por favor, ingrese coordenadas.");

        capaPuntos.clearLayers();
        const features = [];
        const lineas = rawText.split("\n");

        lineas.forEach((linea, index) => {
            const partes = linea.trim().split(/[\s,]+/);
            if (partes.length >= 2) {
                const lat = parseFloat(partes[0]);
                const lon = parseFloat(partes[1]);

                if (!isNaN(lat) && !isNaN(lon)) {
                    features.push({
                        type: "Feature",
                        geometry: { type: "Point", coordinates: [lon, lat] },
                        properties: { 
                            ID: index + 1, 
                            LAT: lat.toFixed(6), 
                            LON: lon.toFixed(6) 
                        }
                    });
                    L.marker([lat, lon]).addTo(capaPuntos).bindPopup("Punto " + (index + 1));
                }
            }
        });

        if (features.length > 0) {
            geojsonGlobal = { type: "FeatureCollection", features: features };
            map.fitBounds(capaPuntos.getBounds());
            alert("Se procesaron " + features.length + " puntos.");
        } else {
            alert("Formato de coordenadas incorrecto.");
        }
    }

    function descargarSHP() {
        if (!geojsonGlobal) return alert("Primero procese los puntos.");

        // Verificamos si la librería cargó correctamente
        if (typeof shpwrite === 'undefined') {
            alert("Error: No se encontró 'shpwrite.js'. Verifica que esté en tu GitHub.");
            return;
        }

        try {
            // Ejecución del motor
            shpwrite.download(geojsonGlobal, {
                folder: 'IGN_PERU_SHP',
                types: {
                    point: 'puntos_exportados'
                }
            });
        } catch (error) {
            console.error(error);
            alert("Error al generar el ZIP: " + error.message);
        }
    }
</script>

</body>
</html>
