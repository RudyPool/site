<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IGN Perú - Servicio de Exportación SHP</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f8f9fa; }
        header { background: #003366; color: white; padding: 1.5rem; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .container { max-width: 900px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; box-sizing: border-box; font-family: 'Courier New', monospace; font-size: 14px; transition: border 0.3s; }
        textarea:focus { border-color: #003366; outline: none; }
        .btn { padding: 15px 25px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: 600; width: 100%; font-size: 16px; margin-bottom: 15px; transition: all 0.2s; }
        .btn-map { background: #003366; }
        .btn-shp { background: #d32f2f; box-shadow: 0 4px 14px rgba(211, 47, 47, 0.4); }
        .btn:active { transform: scale(0.98); }
        #map { height: 400px; border-radius: 12px; margin-top: 20px; border: 1px solid #ddd; }
        .footer-text { font-size: 12px; color: #666; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>Convertidor de Coordenadas a Shapefile</h1>
    <p>Herramienta Web Institucional - IGN Perú</p>
</header>

<div class="container">
    <label>Pega tus coordenadas (Latitud Longitud):</label>
    <textarea id="coordsInput" placeholder="-12.0463 -77.0307&#10;-12.0500 -77.0400"></textarea>
    
    <button class="btn btn-map" onclick="procesarYVer()">1. VISUALIZAR EN MAPA</button>
    <button class="btn btn-shp" onclick="bajarSHP()">2. DESCARGAR .ZIP (SHAPEFILE)</button>
    <p class="footer-text">Compatible con ArcGIS Pro, QGIS y Google Earth.</p>
    
    <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script src="https://bundle.run/shp-write@0.3.2"></script>

<script>
    let miGeoJSON = null;
    const map = L.map('map').setView([-12.04, -77.03], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let marcadoresLayer = L.featureGroup().addTo(map);

    function procesarYVer() {
        const rawText = document.getElementById("coordsInput").value.trim();
        if (!rawText) return alert("Por favor, ingrese datos.");
        
        marcadoresLayer.clearLayers();
        const features = [];
        const lineas = rawText.split("\n");

        lineas.forEach((l, i) => {
            const partes = l.trim().split(/\s+/);
            if (partes.length >= 2) {
                const lat = parseFloat(partes[0]);
                const lon = parseFloat(partes[1]);
                
                if(!isNaN(lat) && !isNaN(lon)) {
                    features.push({
                        type: "Feature",
                        geometry: { type: "Point", coordinates: [lon, lat] },
                        properties: { ID: i + 1, LAT: lat, LON: lon }
                    });
                    L.marker([lat, lon]).addTo(marcadoresLayer);
                }
            }
        });

        miGeoJSON = { type: "FeatureCollection", features: features };
        if (features.length > 0) map.fitBounds(marcadoresLayer.getBounds());
    }

    function bajarSHP() {
        if (!miGeoJSON) return alert("Primero presione 'Visualizar en Mapa'");

        // Accedemos a la librería a través del bundle global
        const motor = window.shpwrite;

        if (!motor) {
            alert("El motor de descarga está tardando. Revise su conexión a Internet.");
            return;
        }

        try {
            // Esta versión usa el método corregido para JSZip 3.0 internamente
            motor.download(miGeoJSON, {
                folder: 'IGN_EXPORT_DATOS',
                types: { point: 'puntos_ign' }
            });
        } catch (error) {
            console.error("Error detectado:", error);
            alert("Error de compatibilidad: " + error.message);
        }
    }
</script>
</body>
</html>
